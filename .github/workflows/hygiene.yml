name: Repository hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, release]

permissions:
  contents: read

env:
  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  hygiene:
    if: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.repository_id) }}
    runs-on: [self-hosted, linux, arm64, plate-curator-device]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Test hygiene checks
        run: node --test scripts/hygiene/*.test.mjs
      - name: Check pull request text
        if: github.event_name == 'pull_request'
        env:
          CI: 'true'
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const { pull_request: pr } = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const result = spawnSync(process.execPath, ['scripts/hygiene/check.mjs', 'pull-request'], {
            stdio: 'inherit',
            env: { ...process.env, PR_TITLE: pr.title, PR_BODY: pr.body ?? '' },
          });
          process.exit(result.status ?? 1);
          NODE
      - name: Check every commit
        env:
          CI: 'true'
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
        run: node scripts/hygiene/check.mjs range "$BASE" "$HEAD"

  secrets:
    if: ${{ github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.repository_id) }}
    runs-on: [self-hosted, linux, arm64, plate-curator-device]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_arm64.tar.gz
          echo "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan commit range
        run: |
          range="$BASE..$HEAD"
          if [[ "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            range="$HEAD"
          fi
          if ! "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts="--diff-merges=first-parent $range" >"$RUNNER_TEMP/gitleaks.log" 2>&1; then
            echo 'Secret scan failed; inspect the range locally with gitleaks v8.30.1.'
            exit 1
          fi
