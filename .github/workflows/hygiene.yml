name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main, release]

permissions:
  contents: read

env:
  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Test hygiene checks
        run: node --test scripts/hygiene/
      - name: Check every commit
        env:
          CI: 'true'
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
        run: node scripts/hygiene/check.mjs range "$BASE" "$HEAD"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan commit range
        run: |
          range="$BASE..$HEAD"
          if [[ "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            range="$HEAD"
          fi
          if ! "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --log-opts="--diff-merges=first-parent $range" >"$RUNNER_TEMP/gitleaks.log" 2>&1; then
            echo 'Secret scan failed; inspect the range locally with gitleaks v8.30.1.'
            exit 1
          fi
