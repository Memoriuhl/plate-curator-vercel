name: Demo pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/demo-pages.yml
      - docs/take-home/part-1.html
      - Plate Curator - Vercel Take Home Walkthrough Artifact.html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Stage the presentation files
        run: |
          mkdir site
          cp docs/take-home/part-1.html site/index.html
          cp 'Plate Curator - Vercel Take Home Walkthrough Artifact.html' site/walkthrough.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
