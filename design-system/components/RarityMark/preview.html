<link rel="stylesheet" href="../../tokens.css" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&family=Geist+Mono:wght@400;500&display=swap"
/>
<style>
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-sans);
  }
  .stage {
    padding: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .btn {
    height: 40px;
    padding: 0 18px;
    border-radius: 999px;
    font-family: var(--font-sans);
    font-weight: 800;
    font-size: 15px;
    border: 2px solid transparent;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--primary);
    color: var(--on-primary);
  }
  .btn-outline {
    background: transparent;
    border-color: var(--primary);
    color: var(--primary);
  }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
  }
  .btn-publish {
    background: var(--info);
    color: #ffffff;
  }
  .btn-push {
    background: var(--danger);
    color: #ffffff;
  }
  .btn-sm {
    height: 32px;
    padding: 0 12px;
    font-size: 13px;
  }
  .mono {
    font-family: var(--font-mono);
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 14px;
  }
  .av {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    color: #ffffff;
    font-weight: 800;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .badge {
    position: absolute;
    right: -4px;
    bottom: -4px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--card);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .ico {
    display: inline-flex;
    width: 26px;
    height: 26px;
    align-items: center;
    justify-content: center;
  }
  .good {
    color: var(--success);
  }
  .weak {
    color: var(--warning);
  }
  .missing {
    color: var(--danger);
  }
  .cap {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
  }
</style>
<div class="stage">
  <span
    style="
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 13px;
    "
    ><svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="var(--rarity-3)"
      stroke-width="2"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M12 3l8 9-8 9-8-9z"></path></svg
    >Out-of-Towner · Estimated</span
  ><span
    style="
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 13px;
    "
    ><svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="var(--rarity-6)"
      stroke="var(--rarity-6)"
      stroke-width="2"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M12 3l8 9-8 9-8-9z"></path></svg
    >Holy Grail · Observed</span
  ><span
    style="
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 13px;
    "
    ><svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="var(--rarity-4)"
      stroke-width="2"
      stroke-dasharray="3 3"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M12 3l8 9-8 9-8-9z"></path></svg
    >Long Hauler · Manual</span
  >
</div>
