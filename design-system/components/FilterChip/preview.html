<!-- @dsCard group="Inputs" height=90 -->
<link rel="stylesheet" href="../../tokens.css" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&family=Geist+Mono:wght@400;500&display=swap"
/>
<style>
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-sans);
  }
  .stage {
    padding: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .btn {
    height: 40px;
    padding: 0 18px;
    border-radius: 999px;
    font-family: var(--font-sans);
    font-weight: 800;
    font-size: 15px;
    border: 2px solid transparent;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--primary);
    color: var(--on-primary);
  }
  .btn-outline {
    background: transparent;
    border-color: var(--primary);
    color: var(--primary);
  }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
  }
  .btn-publish {
    background: var(--info);
    color: #ffffff;
  }
  .btn-push {
    background: var(--danger);
    color: #ffffff;
  }
  .btn-sm {
    height: 32px;
    padding: 0 12px;
    font-size: 13px;
  }
  .mono {
    font-family: var(--font-mono);
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 14px;
  }
  .av {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    color: #ffffff;
    font-weight: 800;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .badge {
    position: absolute;
    right: -4px;
    bottom: -4px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--card);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .ico {
    display: inline-flex;
    width: 26px;
    height: 26px;
    align-items: center;
    justify-content: center;
  }
  .good {
    color: var(--success);
  }
  .weak {
    color: var(--warning);
  }
  .missing {
    color: var(--danger);
  }
  .cap {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-2);
  }
</style>
<div class="stage">
  <button
    aria-pressed="true"
    style="
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 0;
      background: var(--primary);
      color: var(--on-primary);
      font-family: var(--font-sans);
      font-weight: 800;
      font-size: 13px;
    "
  >
    All plates <span class="mono" style="font-size: 11px">44</span></button
  ><button
    aria-pressed="false"
    style="
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 0;
      background: var(--card);
      color: var(--ink);
      font-family: var(--font-sans);
      font-weight: 800;
      font-size: 13px;
    "
  >
    Changed in a batch
    <span class="mono" style="font-size: 11px">4</span></button
  ><button
    style="
      height: 32px;
      padding: 0 10px 0 6px;
      border-radius: 999px;
      border: 0;
      background: var(--card);
      color: var(--danger);
      font-family: var(--font-sans);
      font-weight: 800;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    "
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"
      ></path></svg
    ><span style="color: var(--ink)">No fun facts</span>
    <span class="mono" style="font-size: 11px; color: var(--ink-2)">44</span>
  </button>
</div>
